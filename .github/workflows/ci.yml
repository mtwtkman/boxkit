name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n boxkit && bash -n tests/boxkit.sh
      - name: Run regression tests
        run: bash tests/boxkit.sh
